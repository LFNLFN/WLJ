<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>学习能力评估结果综合分析报告</title>
  <style>
    @page{
      size: A4 portrait;
      margin: 14mm 16mm;
    }

    .tpl-analyzereport *{ box-sizing: border-box; }

    .tpl-analyzereport{
      margin: 0;
      color: #000;
      font-family: "SimSun", "宋体", serif;
      font-size: 14px;
    }

    .tpl-analyzereport .page{
      position: relative;
      width: 100%;
      min-height: 263mm;
    }

    .tpl-analyzereport .page-break{
      break-after: page;
      page-break-after: always;
    }

    .tpl-analyzereport .title{
      margin: 4mm 0 7mm;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .tpl-analyzereport table{
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .tpl-analyzereport td,.tpl-analyzereport th{
      border: 1px solid #000;
      padding: 3px 5px;
      text-align: center;
      vertical-align: middle;
      font-weight: normal;
      word-break: break-all;
    }

    .tpl-analyzereport .info-table td{
      height: 11mm;
    }

    .tpl-analyzereport .label{
      width: 13%;
    }

    .tpl-analyzereport .write-area{
      text-align: left;
      vertical-align: top;
      padding: 5px 7px;
    }

    .tpl-analyzereport .vertical{
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 2px;
      line-height: 1.5;
    }

    .tpl-analyzereport .analysis-table .left-col{
      width: 18%;
    }

    .tpl-analyzereport .analysis-table .content-col{
      width: 82%;
    }

    .tpl-analyzereport .analysis-table .head-row td{
      height: 11mm;
    }

    .tpl-analyzereport .analysis-table .row-lg td{
      height: 42mm;
    }

    .tpl-analyzereport .analysis-table .row-xl td{
      height: 36mm;
    }

    .tpl-analyzereport .analysis-table .row-md td{
      height: 33mm;
    }

    .tpl-analyzereport .analysis-table .row-sm td{
      height: 25mm;
    }

    .tpl-analyzereport .summary-table .left-col{
      width: 18%;
    }

    .tpl-analyzereport .summary-table .row-top td{
      height: 35mm;
    }

    .tpl-analyzereport .summary-table .row-mid td{
      height: 28mm;
    }

    .tpl-analyzereport .summary-table .row-bottom td{
      height: 25mm;
    }

    .tpl-analyzereport .feedback-table{
      margin-top: 10mm;
    }

    .tpl-analyzereport .feedback-table .label-cell{
      width: 24%;
      font-size: 17px;
    }

    .tpl-analyzereport .feedback-table .advice-row td{
      height: 77mm;
    }

    .tpl-analyzereport .feedback-table .sign-row td{
      height: 34mm;
    }

    .tpl-analyzereport .page-number{
      position: absolute;
      bottom: 1mm;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="tpl-analyzereport">

  <!-- 第13页：评估结果摘要 -->
  <section class="page page-break">
    <h1 class="title">学习能力评估结果综合分析报告</h1>

    <table class="info-table">
      <colgroup>
        <col style="width:13%">
        <col style="width:20%">
        <col style="width:13%">
        <col style="width:18%">
        <col style="width:13%">
        <col style="width:23%">
      </colgroup>
      <tr>
        <td>儿童姓名</td>
        <td></td>
        <td>性别</td>
        <td></td>
        <td>出生日期</td>
        <td>　　年　月　日</td>
      </tr>
      <tr>
        <td>评估人员</td>
        <td></td>
        <td>评估日期</td>
        <td colspan="3">　　年　月　日</td>
      </tr>
    </table>

    <table class="analysis-table">
      <colgroup>
        <col class="left-col">
        <col class="content-col">
      </colgroup>
      <tr class="head-row">
        <td>项目</td>
        <td>情况结果摘要</td>
      </tr>

      <tr class="row-lg">
        <td>学业基本资料</td>
        <td class="write-area">
          （包括出生、家庭史、教育史、医疗史、学习特点、兴趣、行为表现等）
        </td>
      </tr>

      <tr class="row-lg">
        <td>家庭资料</td>
        <td class="write-area">
          （父母亲学历、职业、经济能力、亲人关系、亲友等）
        </td>
      </tr>

      <tr class="row-md">
        <td>粗大运动能力</td>
        <td class="write-area"></td>
      </tr>

      <tr class="row-md">
        <td>精细动作能力</td>
        <td class="write-area"></td>
      </tr>

      <tr class="row-md">
        <td>感觉统合能力</td>
        <td class="write-area"></td>
      </tr>
    </table>

    <div class="page-number">13</div>
  </section>

  <!-- 第14页：能力评估摘要续页 -->
  <section class="page page-break">
    <table class="analysis-table">
      <colgroup>
        <col class="left-col">
        <col class="content-col">
      </colgroup>

      <tr class="row-xl">
        <td>认知能力</td>
        <td class="write-area"></td>
      </tr>

      <tr class="row-xl">
        <td>语言交往能力</td>
        <td class="write-area"></td>
      </tr>

      <tr class="row-xl">
        <td>社会技能</td>
        <td class="write-area"></td>
      </tr>
    </table>

    <table class="summary-table" style="margin-top: 10mm;">
      <colgroup>
        <col class="left-col">
        <col class="content-col">
      </colgroup>
      <tr class="row-top">
        <td>测试类别<br>能力及原因</td>
        <td class="write-area"></td>
      </tr>
      <tr class="row-mid">
        <td>学习特点、弱势</td>
        <td class="write-area"></td>
      </tr>
      <tr class="row-mid">
        <td>未来发展潜能</td>
        <td class="write-area"></td>
      </tr>
      <tr class="row-bottom">
        <td>辅导建议</td>
        <td class="write-area"></td>
      </tr>
      <tr class="row-bottom">
        <td>建议方案</td>
        <td class="write-area"></td>
      </tr>
    </table>

    <div class="page-number">14</div>
  </section>

  <!-- 家长建议与希望（末页：min-height 留余量，避免尾页空白） -->
  <section class="page" style="min-height:240mm;">
    <table class="feedback-table">
      <colgroup>
        <col style="width:24%">
        <col style="width:76%">
      </colgroup>

      <tr class="advice-row">
        <td class="label-cell">家长建议与希望</td>
        <td class="write-area"></td>
      </tr>

      <tr class="sign-row">
        <td class="label-cell">分析人员签名</td>
        <td class="write-area"></td>
      </tr>
    </table>
  </section>

</div>
</body>
</html>
