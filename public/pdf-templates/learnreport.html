<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>学习进度报告表</title>
  <style>
    @page{
      size: A4 portrait;
      margin: 14mm 16mm 14mm;
    }

    .tpl-learnreport *{
      box-sizing: border-box;
    }

    .tpl-learnreport{
      margin: 0;
      font-family: "SimSun", "宋体", serif;
      color: #000;
      font-size: 14px;
    }

    .tpl-learnreport .page{
      position: relative;
      min-height: 263mm;
      width: 100%;
    }

    .tpl-learnreport .page-break{
      break-after: page;
      page-break-after: always;
    }

    .tpl-learnreport .title{
      margin: 3mm 0 2mm;
      text-align: center;
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .tpl-learnreport .term{
      margin-bottom: 6mm;
      text-align: center;
      font-size: 16px;
    }

    .tpl-learnreport .line{
      display: inline-block;
      min-width: 35mm;
      height: 5mm;
      border-bottom: 1px solid #000;
      vertical-align: bottom;
    }

    .tpl-learnreport table{
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .tpl-learnreport td,.tpl-learnreport th{
      border: 1px solid #000;
      padding: 2px 3px;
      text-align: center;
      vertical-align: middle;
      font-weight: normal;
      word-break: break-all;
    }

    .tpl-learnreport .info-table td{
      height: 11mm;
    }

    .tpl-learnreport .label{
      width: 11%;
    }

    .tpl-learnreport .blank{
      background: #fff;
    }

    .tpl-learnreport .progress-table{
      margin-top: 0;
    }

    .tpl-learnreport .progress-table th{
      height: 10mm;
    }

    .tpl-learnreport .progress-table .category{
      font-size: 16px;
    }

    .tpl-learnreport .progress-table .write-row td{
      height: 7.2mm;
    }

    .tpl-learnreport .vertical-text{
      display: inline-block;
      line-height: 1.4;
      letter-spacing: 2px;
    }

    .tpl-learnreport .page-number{
      position: absolute;
      bottom: 1mm;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
    }

    .tpl-learnreport .parent-box{
      height: 210mm;
      margin-top: 10mm;
      border: 1px solid #000;
      position: relative;
      padding: 10mm 10mm 10mm 24mm;
    }

    .tpl-learnreport .parent-label{
      position: absolute;
      top: 50%;
      left: 7mm;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 3px;
      font-size: 16px;
    }

    .tpl-learnreport .signature{
      margin-top: 7mm;
      text-align: right;
      font-size: 16px;
    }

    @media print{
      .tpl-learnreport .page{
        min-height: 263mm;
      }
    }
  </style>
</head>

<body>
<div class="tpl-learnreport">

  <!-- 第19页：学习进度报告表首页 -->

    <h1 class="title">学习进度报告表</h1>
