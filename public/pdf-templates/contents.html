<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>目录</title>
  <style>
    .tpl-contents *{
      box-sizing: border-box;
    }

    .tpl-contents{
      margin: 0;
      background: #f2f2f2;
      font-family: "SimSun", "宋体", serif;
      color: #111;
    }

    .tpl-contents .page{
      width: 210mm;
      min-height: 297mm;
      margin: 20px auto;
      padding: 28mm 30mm;
      background: #fff;
    }

    .tpl-contents h1{
      margin: 0 0 28px;
      text-align: center;
      font-size: 30px;
      font-weight: normal;
      letter-spacing: 14px;
    }

    .tpl-contents .sub-title{
      margin-bottom: 18px;
      text-align: center;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .tpl-contents .toc{
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 18px;
      line-height: 2;
    }

    .tpl-contents .toc li{
      display: flex;
      align-items: baseline;
      gap: 8px;
      white-space: nowrap;
    }

    .tpl-contents .item-title{
      flex: 0 0 auto;
    }

    .tpl-contents .dots{
      flex: 1;
      border-bottom: 2px dotted #222;
      transform: translateY(-4px);
    }

    .tpl-contents .page-number{
      min-width: 28px;
      text-align: right;
    }

    .tpl-contents .attachment{
      margin-top: 4px;
    }

    @media print{
      .tpl-contents{
        background: #fff;
      }

      .tpl-contents .page{
        margin: 0;
      }
    }
  </style>
</head>
<body>
<div class="tpl-contents">
  <main class="page">
    <h1>目录</h1>

    <div class="sub-title">广州市智障幼儿康复中心康复训练档案</div>

    <ul class="toc">
      <li>
        <span class="item-title">儿童入学登记表</span>
        <span class="dots"></span>
        <span class="page-number">1</span>
      </li>

      <li>
        <span class="item-title">智障儿童学习能力评估表</span>
        <span class="dots"></span>
        <span class="page-number">4</span>
      </li>

      <li>
        <span class="item-title">感觉统合训练能力评估量表</span>
        <span class="dots"></span>
        <span class="page-number">6</span>
      </li>

      <li>
        <span class="item-title">智障儿童康复训练个别化教育计划（IEP）</span>
        <span class="dots"></span>
        <span class="page-number">12</span>
      </li>

      <li>
        <span class="item-title">个别教学记录卡</span>
        <span class="dots"></span>
        <span class="page-number">15</span>
      </li>

      <li>
        <span class="item-title">幼儿康复训练进度报告表</span>
        <span class="dots"></span>
        <span class="page-number">17</span>
      </li>

      <li>
        <span class="item-title">儿童启蒙教育跟踪表</span>
        <span class="dots"></span>
        <span class="page-number">19</span>
      </li>

      <li class="attachment">
        <span class="item-title">【附件一】儿童出生医学证明</span>
        <span class="dots"></span>
        <span class="page-number">22</span>
      </li>

      <li>
        <span class="item-title">【附件二】残疾人证卡</span>
        <span class="dots"></span>
        <span class="page-number">24</span>
      </li>

      <li>
        <span class="item-title">【附件三】监护人身份证</span>
        <span class="dots"></span>
        <span class="page-number">25</span>
      </li>

      <li>
        <span class="item-title">【附件四】儿童健康证明</span>
        <span class="dots"></span>
        <span class="page-number">26</span>
      </li>

      <li>
        <span class="item-title">【附件五】智障医学诊断书</span>
        <span class="dots"></span>
        <span class="page-number">27</span>
      </li>

      <li>
        <span class="item-title">【附件六】残疾证</span>
        <span class="dots"></span>
        <span class="page-number">28</span>
      </li>

      <li>
        <span class="item-title">【附件七】残疾证</span>
        <span class="dots"></span>
        <span class="page-number">29</span>
      </li>
    </ul>
  </main>
</div>
</body>
</html>
