<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>智障儿童后续教育跟踪表</title>
  <style>
    @page{
      size: A4 portrait;
      margin: 18mm 17mm 15mm;
    }

    .tpl-catchup *{
      box-sizing: border-box;
    }

    .tpl-catchup{
      margin: 0;
      font-family: "SimSun", "宋体", serif;
      color: #000;
      font-size: 16px;
    }

    .tpl-catchup .page{
      position: relative;
      width: 100%;
      min-height: 258mm;
    }

    .tpl-catchup .page-break{
      break-after: page;
      page-break-after: always;
    }

    .tpl-catchup .title{
      margin: 6mm 0 9mm;
      text-align: center;
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .tpl-catchup table{
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .tpl-catchup td{
      height: 18mm;
      border: 1px solid #000;
      padding: 4px 6px;
      text-align: center;
      vertical-align: middle;
      word-break: break-all;
    }

    .tpl-catchup .label{
      width: 13%;
      font-weight: normal;
    }

    .tpl-catchup .write-area{
      height: 25mm;
    }

    .tpl-catchup .page-number{
      position: absolute;
      bottom: 1mm;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
    }

    .tpl-catchup .follow-table td{
      height: 28mm;
    }

    .tpl-catchup .follow-table .label{
      width: 14%;
    }

    .tpl-catchup .follow-table .long-row td{
      height: 34mm;
    }

    @media print{
      .tpl-catchup .page{
        min-height: 258mm;
      }
    }
  </style>
</head>
<body>
<div class="tpl-catchup">

  <!-- 第22页 -->
  <section class="page page-break">
    <h1 class="title">智障儿童后续教育跟踪表</h1>

    <table>
      <colgroup>
        <col style="width: 13%;">
        <col style="width: 24%;">
        <col style="width: 13%;">
        <col style="width: 16%;">
        <col style="width: 14%;">
        <col style="width: 20%;">
      </colgroup>

      <tr>
        <td class="label">姓　名</td>
        <td></td>
        <td class="label">性　别</td>
        <td></td>
        <td class="label">出生日期</td>
        <td></td>
      </tr>

      <tr>
        <td class="label">毕业机构</td>
        <td></td>
        <td class="label">毕业时间</td>
        <td></td>
        <td class="label">康复程度</td>
        <td></td>
      </tr>

      <tr>
        <td class="label">转入<br>幼儿园名称</td>
        <td colspan="3" class="write-area"></td>
        <td class="label">入读日期</td>
        <td></td>
      </tr>

      <tr>
        <td class="label">转介转读<br>学校名称</td>
        <td colspan="3" class="write-area"></td>
        <td class="label">入读日期</td>
        <td></td>
      </tr>

      <tr>
        <td class="label">转介普通<br>小学名称</td>
        <td colspan="3" class="write-area"></td>
        <td class="label">入读日期</td>
        <td></td>
      </tr>

      <tr>
        <td class="label">被访同人</td>
        <td colspan="3"></td>
        <td class="label">联系电话</td>
        <td></td>
      </tr>
    </table>

    <div class="page-number">22</div>
  </section>

  <!-- 第23页 -->
  <section class="page">
    <table class="follow-table">
      <colgroup>
        <col style="width: 14%;">
        <col style="width: 58%;">
        <col style="width: 14%;">
        <col style="width: 14%;">
      </colgroup>

      <tr>
        <td class="label">访问地点</td>
        <td></td>
        <td>对方态度（　）</td>
        <td>目的（　）</td>
      </tr>

      <tr>
        <td class="label">上学表现</td>
        <td colspan="3"></td>
      </tr>

      <tr>
        <td class="label">作业情况</td>
        <td colspan="3"></td>
      </tr>

      <tr>
        <td class="label">身体状况</td>
        <td colspan="3"></td>
      </tr>

      <tr>
        <td class="label">行为表现</td>
        <td colspan="3"></td>
      </tr>

      <tr>
        <td class="label">其它表现</td>
        <td colspan="3"></td>
      </tr>

      <tr class="long-row">
        <td class="label">目前存在<br>问题和困难</td>
        <td colspan="3"></td>
      </tr>
    </table>

    <div class="page-number">23</div>
  </section>

</div>
</body>
</html>
