<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>智障康复个别化教育计划（IEP）</title>
  <style>
    @page{
      size: A4 portrait;
      margin: 14mm 16mm;
    }

    .tpl-iep *{ box-sizing: border-box; }

    .tpl-iep{
      margin: 0;
      color: #000;
      font-family: "SimSun", "宋体", serif;
      font-size: 14px;
    }

    .tpl-iep .page{
      position: relative;
      min-height: 263mm;
      width: 100%;
    }

    .tpl-iep .page-break{
      break-after: page;
      page-break-after: always;
    }

    .tpl-iep .title{
      margin: 2mm 0 6mm;
      text-align: center;
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .tpl-iep table{
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .tpl-iep td,.tpl-iep th{
      border: 1px solid #000;
      padding: 3px 4px;
      text-align: center;
      vertical-align: middle;
      font-weight: normal;
      word-break: break-all;
    }

    .tpl-iep .info-table td{
      height: 11mm;
    }

    .tpl-iep .vertical{
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 2px;
      line-height: 1.5;
    }

    .tpl-iep .iep-table{
      margin-top: 0;
    }

    .tpl-iep .iep-table .head-row td{
      height: 12mm;
    }

    .tpl-iep .iep-table .area{
      width: 12%;
      font-size: 16px;
    }

    .tpl-iep .iep-table .long-goal{
      width: 36%;
    }

    .tpl-iep .iep-table .short-goal{
      width: 38%;
    }

    .tpl-iep .iep-table .score{
      width: 3.5%;
    }

    .tpl-iep .iep-table .content-row td{
      height: 82mm;
    }

    .tpl-iep .iep-table .mid-row td{
      height: 59mm;
    }

    .tpl-iep .iep-table .last-row td{
      height: 59mm;
    }

    .tpl-iep .note{
      margin: 5mm 0 0 4mm;
      font-size: 17px;
      line-height: 1.8;
    }

    .tpl-iep .page-number{
      position: absolute;
      bottom: 1mm;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
    }

    @media print{
      .tpl-iep .page{ min-height: 263mm; }
    }
  </style>
</head>
<body>
<div class="tpl-iep">

  <!-- 第15页 -->
  <section class="page page-break">
    <h1 class="title">智障康复个别化教育计划（IEP）</h1>

    </table>

    <div class="page-number">15</div>

        <col class="score">
      </colgroup>

      <tr class="mid-row">

        <td></td>

        <td></td><td></td><td></td><td></td>
      </tr>

      <tr class="mid-row">

        <td></td>

        <td></td><td></td><td></td><td></td>
      </tr>

      <tr class="mid-row">

  </section>

  <!-- 第17页：生活自理及评估说明（末页：min-height 留余量，避免尾页空白） -->
  <section class="page" style="min-height:240mm;">
    <table class="iep-table">
      <colgroup>
        <col class="area">

      <tr class="last-row">

</div>

</html>
